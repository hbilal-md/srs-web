[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "srs-pipelines"
version = "0.1.0"
description = "Card creation pipelines for SRS Web"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "pillow>=10.0.0",
    "pymupdf>=1.23.0",
    "openai>=1.10.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["shared", "kurts_notes"]
